#What is async/await?

-async/await is a modern and cleaner way to work with Promises in JavaScript.



-What is async keyword?
async is used before a function
It automatically returns a Promise
Whatever value you return from an async function becomes a resolved Promise.
When you manually use resolve() or reject() inside an async function, you are controlling the promise state.

example.1
async function  abcd() {
  return "hello world"    //Promise.resolve("hello world")
}


abcd()
.then(res=>{
  console.log(res);
})


ex.2
async function abcd(){
  console.log("fetching...");
  return new Promise((resolve,reject)=>{
    setTimeout(()=>{
       resolve("data is fetched")
    },2000)
  })
}

abcd()
.then(res=>{
  console.log(res);
})
.catch(err=>{
  console.log(err);
})





-What is await keyword?
await is used inside async functions only
It waits for a Promise to resolve
It pauses execution of that line until the promise settles.
Await always expects a value that can be treated like a Promise. like this Promise.resolve(value)

 function getData() {
  return new Promise(resolve => {
    setTimeout(() => resolve("Data Received"), 2000);
  });
}

async function getInfo() {
  console.log("Fetching...");
  const result = await getData();
  console.log(result);
}

getInfo();



