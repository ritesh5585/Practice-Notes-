# asynchronous javascript ----------------------------------------------

- Synchronous vs asynchronous JS : 


-what is asynchronous JS ? 
“Asynchronous JavaScript enables non-blocking operations(Fetching data from an API,Reading files,Waiting for a timerNetwork requests), allowing long-running tasks to run in the background while the main thread continues executing. It is implemented using callbacks, promises, async/await, and the event loop.”


-what is non-blocking operations in JS?
non blocking operations like fetching data from an API,reading files or waiting for timerNetwork request, JS does not wait for them to complete. It sends these task aside and keep moving



Thread = A path of execution where code runs line by line.
JS has only ONE thread — meaning it can do one thing at a time, in order.


-is javascript synchronous language or asynchronous?
“JavaScript is a synchronous, single-threaded language by default, meaning it executes code line by line. However, it provides mechanisms to handle asynchronous operations using features like callbacks, Promises, async/await, and the event loop.



-Why do we need Asynchronous JavaScript?
Because some tasks take time—for completion , which not depend on  us example:
Fetching data from an API
Reading files
Waiting for a timer
Network requests
If JavaScript waited for each of them, the program would freeze.
Asynchronous JS solves this problem.




-How is Async behavior achieved?
By Using:
Callbacks
Promises
Async/Await
Event Loop, Web APIs, and Callback Queue




Note : In javascript after completing executing all synchronous code,after then asynchronous code will execute in main stack.

behind the scene : 

--Asynchronous code
--web APIs(browser part);
Web APIs are built-in browser features that handle asynchronous operations outside the JavaScript engine.
after processing the task, Web APIs push the callback function to the appropriate queue (callback queue or microtask queue) for execution.
--callback que / microtask que
callback queue stores callbacks from asynchronous tasks like:
setTimeout()
DOM events (click, mousemove)
setInterval()

microtask queue stores microtasks like:
Promises (.then(), .catch(), .finally())

➡️ Microtask Queue has higher priority than Callback Queue.
➡️ Microtasks are always executed before callback que tasks


event loop
The Event Loop continuously checks the Call Stack and the Queue.
If the Call Stack becomes empty, the Event Loop takes tasks from the Microtask Queue first, then the Callback (Macrotask) Queue, and pushes them to the Call Stack for execution.


call-stack
where all code are executed. part of js engine.
and used LIFO(last in fast out) method



-difference b/w synchronous code vs asynchronous code ?

synchronous                               asynchronous
execute line by line                 execute without  blocking other operations

each line wait for preivous           long task run in the background
 line to be finish 

blocking                                 non-blocking

ex. normal function,loops            setInterval,fetch,promises






callback: whenever a function accept an another function as a parameter and involked that function inside its body, that is called callback function.
✅ Callback that runs immediately → Synchronous
⏳ Callback that runs later → Asynchronous



callback hell : Callback Hell is a situation in JavaScript where multiple nested callbacks are used one inside another, creating deeply indented and hard-to-read code.

