📘 Execution Context & Functions (Concise Notes)

🔹 Execution Context
Every JS code runs inside an execution context.
Each context has 2 phases:
1. Creation Phase
Memory is allocated.
var variables → initialized with undefined.
let & const → allocated but remain uninitialized (TDZ). 
Function declarations → full function loaded into memory.

2. Execution Phase
Code runs line by line.
Variables get actual values.



🔹 Types of Execution Context
1.Global Execution Context (GEC) → created when JS starts.
2.Function Execution Context (FEC) → created whenever a fun2.ction is called.


🔹 Call Stack
Global Execution Context (GEC) → created when JS starts.
Function Execution Context (FEC) → created whenever a function is called.


🔹 Functions & Hoisting.
1. Function Declaration
greet(); // ✅ Works
function greet() {
  console.log("Hello!");
}
Fully hoisted to memory.
Can be used before or after definition.




2. Function Expression with var
greet(); // ❌ TypeError: greet is not a function
var greet = function() {
  console.log("Hello!");
};
var is hoisted as undefined.
Function assigned only during execution phase.
function Expression is not hoisted.



3. Function Expression with let / const
greet(); // ❌ ReferenceError
let greet = function() {
  console.log("Hello!");
};
In TDZ (Temporal Dead Zone) until execution reaches that line.
Cannot be accessed before initialization.



Example[advanced] :
for (var i = 1; i <= 3; i++) {
  setTimeout(function() {
    console.log("var i:", i);
  }, i * 1000);
}

for (let j = 1; j <= 3; j++) {
  setTimeout(function() {
    console.log("let j:", j);
  }, j * 1000);
}
     
guess the output ?
var is function-scoped, not block-scoped.
