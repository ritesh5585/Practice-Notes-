Object-Oriented Programming (OOP) is a programming paradigm that organizes software design around objects, which represent real-world entities and contain data (properties) and behavior (methods).

   
🧠 4 Pillars of OOP in JavaScript:----

Encapsulation            Hiding internal details                           private fields, getters/setters
Abstraction              Hiding  complexity & showing only functionality    abstract methods via classes
Inheritance              Reuse parent properties/methods                   extends, super()
Polymorphism             Same method, different behavior                   method overriding



