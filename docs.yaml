#What is a Promise?
A Promise is an object in JavaScript that represents the result of an asynchronous operation that may complete in the future (not immediately)


#It has three states:
State	    Meaning
Pending	  Still working / waiting
Fulfilled (Resolved)	Successfully completed
Rejected	Failed with an error



#Why Do We Need Promises?
Because callbacks create callback hell, are difficult to maintain, difficult to read, difficult to debug , that's why.



#Creating a Promise
let promise = new Promise((resolve, reject) => {
  let success = true;

  if (success) {
    resolve("Task completed successfully!");
  } else {
    reject("Something went wrong!");
  }
});


console.log(promise);



function promise(){
 return new Promise((resolve,reject)=>{
   let sucess = true;
   if(sucess){
    resolve("you win")
   }
   else{
    reject("you loose")
   }
  })
}
console.log(promise())



let pr = Promise.resolve("hey i am done")
let pr = Promise.reject("undo")


#applying .then,.catch.,.finally on promises(consume)
promise()
.then(res=>{
  console.log(res);
})
.catch(err=>{
  console.log(err);
})
.finally(() => {
    console.log("Cleanup: Operation completed."); // This will always run
});



#promises with setTimeOut(async work)
function fetchData(){
  return new Promise((resolve,reject)=>{
    let status = true
    console.log("data is fetching...");
    setTimeout(()=>{
      if(status){
        resolve("data is fetched")
      }
      else{
        reject("network error")
      }
    },2000)
  })
}


fetchData()
.then(res=>{
  console.log(res);
})
.catch(err=>{
  console.log(err);
})
.finally(()=>{
  console.log("complete operation!");
})






# ⏳ Chaining Promises (Avoiding Callback Hell)
ex.1 
// because anything returned inside .then() becomes a resolved promise automatically.
function step1(){
  return Promise.resolve("hello g kaise ho saare.")
}

step1()
.then(res=>{
  console.log(res);
  return "ha g mein achha hoon"; // behind the scene return Promise.resolve("ha g mein achha hoon")
})
.then((res)=>{
  console.log(res);
  return "bha re bhagode"
})
.then((res=>{
  console.log(res);
  return "sala kuttar bachha";
}))
.then(res=>{
  console.log(res);
})



ex. 2


function step1(){
  return Promise.resolve("step 1 is done")
}

function step2(){
  return Promise.reject('step 2 is done')
}

function step3(){
  return Promise.resolve("step 3 is done")
}

step1()
.then(res=>{
  console.log(res);
  return step2()
})
.then((res)=>{
  console.log(res);
  return step3();
})
.then((res)=>{
  console.log(res);
})
.catch((err)=>{
  console.log(err);
})





#Promoses real life example : 

function orderFood() {
  let status = true;
  console.log("your order is processing...");

  return new Promise((resolve, reject) => {
    setTimeout(() => {
      if (status) {
        resolve("your oder is accepted🎉✅");
      } else {
        reject("sorry our all kitchen is busy now, please try after some time");
      }
    }, 5000);
  });
}




function makingFood() {
  let status = true;
  console.log("your food is making...");
  return new Promise((resolve, reject) => {
    setTimeout(() => {
      if (status) {
        resolve("your food is ready for delivary");
      } else {
        reject("sorry for incovience!we will refund your money(within 1 hour)");
      }
    }, 5000);
  });
}




function delivaryFood() {
  let status = true;
  console.log("your food is on the way");
  return new Promise((resolve, reject) => {
    setTimeout(() => {
      if (status) {
        resolve("here is you food sir");
      } else {
        reject("we are on the way, take little time!");
      }
    }, 3000);
  });
}


function eatFood(){
  let status = true;
  console.log("i am just eating you food");
  return new Promise((resolve,reject)=>{
     setTimeout(()=>{
       if(status){
      resolve("good food")
     }
     else{
      reject("bad food experience")
     }
     },2000)
  })
}


orderFood()
  .then((res) => {
    console.log(res);
    return makingFood();
  })
  .then((res) => {
    console.log(res);
    return delivaryFood();
  })
  .then((res) => {
    console.log(res);
    return eatFood();
  })
  .then(res=>{
    console.log(res);
  })
 .catch(err=>{
  console.log(err);
 });



#1. Promise.all()
- wait for all promises to resolve;
- if any of them fails then entire result become rejected;

const p1 = Promise.resolve("Pizza ready")
const p2 = Promise.reject("Burger Ready")
const p3 = Promise.resolve("Coke ready")

Promise.all([p1,p2,p3])
.then(res=>{
  console.log(res);
})
.catch(err=>{
  console.log(err);
})




