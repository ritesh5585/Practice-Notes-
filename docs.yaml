})




async function fetchData(){
console.log("data is fetching...");
try {
   let data =  await fetch("https://fakestoreapi.com/productss")
   if(!data.ok)
    throw new Error("something went wrong");

   let result =  await data.json()
   return result
  
} catch (error) {
  console.log(error.message);
  return Promise.reject(error.message)
}
}

fetchData()
.then(res=>{
  console.log(res);
  console.log("data fetched completed");
})
.catch(err=>{
  console.log(err);
})




















# Example: Accidental Global Variable  where this global leakage creates unexpected behavior? ; we should always have to define let const var during declaraton

function calculatePrice(price, tax) {
  total = price + (price * tax); // ⚠️ forgot `let/const`
  return total;
}

console.log(calculatePrice(100, 0.1)); // 110
console.log(total); // 😱 110 (global variable!)



# Understanding the loop with var with settimeout or setinterval

-var i = 1; → var is function-scoped, not block-scoped.
-So, during the entire loop, there’s only one i variable shared across all iterations.

