# // Method Overriding (Polymorphism concept in javascript oops)

function Payment(amount){
  this.amount = amount
}

Payment.prototype.pay = function(){
  console.log(`paying ${this.amount} using default method`);
}


function UpiPayment(amount,upiId){
  Payment.call(this,amount);
  this.upiId = upiId;
}

UpiPayment.prototype = Object.create(Payment.prototype);
UpiPayment.prototype.constructor = UpiPayment;

UpiPayment.prototype.pay = function(){
  console.log(`paying ${this.amount} from upi ${this.upiId}`);
}


function CardPayment(amount,cardNo){
  Payment.call(this,amount);
  this.cardNo = cardNo;
}

CardPayment.prototype = Object.create(Payment.prototype);
CardPayment.prototype.constructor = CardPayment;

CardPayment.prototype.pay = function(){
  console.log(`paying ${this.amount} from cardno ${this.cardNo}`);
}

function CashPayment(amount){
  Payment.call(this,amount);
}


CashPayment.prototype = Object.create(Payment.prototype);
CashPayment.prototype.constructor = CashPayment;

CashPayment.prototype.pay = function(){
  console.log(`paying ${this.amount} in cash`);
}

const p1 = new UpiPayment(500, "sourav@ybl");
const p2 = new CardPayment(1000, "1234567812345678");
const p3 = new CashPayment(200);

p1.pay();
p2.pay();
p3.pay();




