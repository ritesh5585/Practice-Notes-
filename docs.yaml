# Lexical scope vs dynamic scope

 Lexical scoping: A variable is accessible based on its placement in the source code, not from where it is called.
 lexically means physically

 function abcd(){
     let a=12;   
     if(true){
     console.log(a);
   }
 }

  Dynamic scoping: The value you get depends on WHERE you are calling from. There is not such concept of dynamic scoping exists, if there is a dynamic scoping
  then the ans would be.

 let a = 13;

 function abcd(){   
  console.log(a);
 }

 function defg(){
   let a = 15;
   abcd()
 }

 defg() 



  If JavaScript had dynamic scoping (it doesn't, but imagine):

 let x = "global";

 function outer() {
     let x = "outer";
     inner();  Called from outer
 }

 function inner() {
     console.log(x);  In dynamic scoping, this would look at WHERE inner was called from
 }

 function another() {
     let x = "another";
     inner();  Called from another
 }

  In dynamic scoping:
 outer();    Would print "outer" (because inner was called from outer)
 another();  Would print "another" (because inner was called from another)
 inner();    Would print "global" (because inner was called from global scope)






